[mutmut]
paths_to_mutate=
    scripts/pordata_lib.py
    scripts/harvest_catalogue.py
    scripts/build_catalogue.py
    scripts/qa_catalogue.py
    scripts/repair_pages.py
    scripts/diff_sitemap.py
    scripts/fetch_featured_sets.py
    scripts/check_pages_live.py
    scripts/build_crosswalk.py
    scripts/coverage_gap.py
    scripts/build_detail_pages.py
    scripts/mutation_gate.py
# mutmut runs the suite from a copied tree, so anything the tests read
# off disk has to come along. test_workflows.py reads .github/workflows;
# test_detail_pages.py's DesignSystemTest reads the components it
# asserts against (site/src), the font links (site/index.html) and the
# compiled shadow value (docs/assets); test_eurostat_crosswalk.py's
# ShippedTest reads the committed crosswalk to assert the invariants a
# reader meets. Without these the tests fail in the mutants tree with a
# FileNotFoundError that looks like a bug in the code under test.
# Narrowed from `.github/` to the directory the suite actually reads:
# `tests/test_workflows.py` now asserts this list is covered by
# `tests.yml`'s push paths, and a broader entry here than there means the
# assertion is comparing two different things.
also_copy=
    scripts/
    .github/workflows/
    site/src/
    site/index.html
    docs/assets/
    data/crosswalk/
tests_dir=tests/
