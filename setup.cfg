[mutmut]
paths_to_mutate=
    scripts/pordata_lib.py
    scripts/harvest_catalogue.py
    scripts/build_catalogue.py
    scripts/qa_catalogue.py
    scripts/repair_pages.py
    scripts/diff_sitemap.py
    scripts/fetch_featured_sets.py
    scripts/check_pages_live.py
    scripts/build_crosswalk.py
    scripts/coverage_gap.py
    scripts/build_detail_pages.py
    scripts/mutation_gate.py
# mutmut runs the suite from a copied tree, so anything the tests read
# off disk has to come along. test_workflows.py reads .github/workflows;
# test_detail_pages.py's DesignSystemTest reads the components it
# asserts against (site/src), the font links (site/index.html) and the
# compiled shadow value (docs/assets). Without these the tests fail in
# the mutants tree with a FileNotFoundError that looks like a bug in the
# code under test.
also_copy=
    scripts/
    .github/
    site/src/
    site/index.html
    docs/assets/
tests_dir=tests/
