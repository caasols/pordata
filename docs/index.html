<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pordata map — catálogo de indicadores</title>
<meta name="description" content="Catálogo pesquisável dos indicadores da PORDATA. Apenas metadados; os valores estão na PORDATA e nas fontes oficiais.">
<script>
  /* set theme before first paint to avoid a flash */
  try {
    var t = localStorage.getItem("theme");
    if (t === "dark" || (t !== "light" &&
        matchMedia("(prefers-color-scheme: dark)").matches))
      document.documentElement.classList.add("dark");
  } catch (e) {}
</script>
<style>
  /* ---- shadcn theme tokens --------------------------------------------
     Default neutral (zinc) theme. To apply a preset (e.g. from tweakcn),
     replace the :root and .dark blocks below with the preset's exported
     CSS variables — everything else reads from these tokens. */
  :root {
    --background: 0 0% 100%;
    --foreground: 240 10% 3.9%;
    --card: 0 0% 100%;
    --card-foreground: 240 10% 3.9%;
    --primary: 240 5.9% 10%;
    --primary-foreground: 0 0% 98%;
    --secondary: 240 4.8% 95.9%;
    --secondary-foreground: 240 5.9% 10%;
    --muted: 240 4.8% 95.9%;
    --muted-foreground: 240 3.8% 46.1%;
    --accent: 240 4.8% 95.9%;
    --accent-foreground: 240 5.9% 10%;
    --destructive: 0 84.2% 60.2%;
    --destructive-foreground: 0 0% 98%;
    --border: 240 5.9% 90%;
    --input: 240 5.9% 90%;
    --ring: 240 10% 3.9%;
    --radius: 0.625rem;
  }
  .dark {
    --background: 240 10% 3.9%;
    --foreground: 0 0% 98%;
    --card: 240 9% 6%;
    --card-foreground: 0 0% 98%;
    --primary: 0 0% 98%;
    --primary-foreground: 240 5.9% 10%;
    --secondary: 240 3.7% 15.9%;
    --secondary-foreground: 0 0% 98%;
    --muted: 240 3.7% 15.9%;
    --muted-foreground: 240 5% 64.9%;
    --accent: 240 3.7% 15.9%;
    --accent-foreground: 0 0% 98%;
    --destructive: 0 62.8% 30.6%;
    --destructive-foreground: 0 0% 98%;
    --border: 240 3.7% 15.9%;
    --input: 240 3.7% 15.9%;
    --ring: 240 4.9% 83.9%;
  }

  /* ---- base ---- */
  * { box-sizing: border-box; border-color: hsl(var(--border)); }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: hsl(var(--background)); color: hsl(var(--foreground));
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
      Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 768px; margin: 0 auto; padding: 28px 16px 64px; }
  a { color: inherit; }

  /* ---- header ---- */
  .top { display: flex; align-items: center; justify-content: space-between;
         flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
  h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  h1 a { text-decoration: none; }
  .controls { display: flex; align-items: center; gap: 8px; }

  /* lang picker: shadcn tabs */
  .lang {
    display: inline-flex; align-items: center; gap: 2px;
    background: hsl(var(--muted)); border-radius: var(--radius); padding: 3px;
  }
  .lang span {
    cursor: pointer; padding: 3px 9px; font-size: .8rem; font-weight: 500;
    color: hsl(var(--muted-foreground));
    border-radius: calc(var(--radius) - 4px); user-select: none;
  }
  .lang span.on {
    background: hsl(var(--background)); color: hsl(var(--foreground));
    box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.06);
  }

  /* theme toggle: shadcn ghost icon button */
  #themeBtn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 2.1rem; width: 2.1rem; border: 1px solid hsl(var(--border));
    border-radius: calc(var(--radius) - 2px); background: transparent;
    color: hsl(var(--muted-foreground)); cursor: pointer; font-size: 1rem;
  }
  #themeBtn:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }

  .sub { color: hsl(var(--muted-foreground)); margin: 8px 0 20px; font-size: .92rem; }
  .sub b { color: hsl(var(--foreground)); font-weight: 600; }
  .sub a { color: hsl(var(--foreground)); text-underline-offset: 3px; }

  /* ---- input: shadcn input ---- */
  #q {
    width: 100%; height: 2.75rem; padding: 0 14px; font-size: 1rem;
    font-family: inherit; color: hsl(var(--foreground));
    background: hsl(var(--background));
    border: 1px solid hsl(var(--input));
    border-radius: calc(var(--radius) - 2px); outline: none;
  }
  #q::placeholder { color: hsl(var(--muted-foreground)); }
  #q:focus-visible {
    border-color: hsl(var(--ring));
    box-shadow: 0 0 0 3px hsl(var(--ring) / 0.18);
  }

  /* ---- area filters: shadcn toggle badges ---- */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; }
  .chip {
    padding: 4px 12px; border-radius: 999px; font-size: .82rem; font-weight: 500;
    border: 1px solid hsl(var(--border)); background: transparent;
    color: hsl(var(--muted-foreground)); cursor: pointer; user-select: none;
  }
  .chip:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
  .chip.on {
    background: hsl(var(--primary)); border-color: hsl(var(--primary));
    color: hsl(var(--primary-foreground));
  }

  #meta { color: hsl(var(--muted-foreground)); font-size: .82rem; margin: 12px 2px; }

  /* ---- results: shadcn cards ---- */
  .card {
    background: hsl(var(--card)); color: hsl(var(--card-foreground));
    border: 1px solid hsl(var(--border)); border-radius: var(--radius);
    padding: 14px 16px; margin: 10px 0;
    box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.04);
    overflow-wrap: anywhere; /* long slugs/URLs must never widen the page */
  }
  .card a.name {
    font-weight: 600; font-size: .98rem; text-decoration: none;
    text-underline-offset: 3px;
  }
  .card a.name:hover { text-decoration: underline; }
  .alt { font-size: .84rem; color: hsl(var(--muted-foreground)); margin-top: 2px; }
  .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    display: inline-flex; align-items: center;
    background: hsl(var(--secondary)); color: hsl(var(--secondary-foreground));
    border-radius: calc(var(--radius) - 4px);
    padding: 2px 8px; font-size: .74rem; font-weight: 500;
  }
  .tag.removed { background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); }
  .tag.outline {
    background: transparent; border: 1px solid hsl(var(--border));
    color: hsl(var(--muted-foreground)); font-weight: 400;
  }
  .desc { margin: 8px 0 0; font-size: .88rem; color: hsl(var(--muted-foreground)); }

  footer {
    margin-top: 44px; padding-top: 18px; border-top: 1px solid hsl(var(--border));
    color: hsl(var(--muted-foreground)); font-size: .82rem;
  }
  footer a { color: hsl(var(--foreground)); text-underline-offset: 3px; }
  footer div { margin-top: 6px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1><a href="./">pordata map</a></h1>
    <div class="controls">
      <div class="lang" id="lang"></div>
      <button id="themeBtn" aria-label="Light/dark theme"></button>
    </div>
  </div>
  <p class="sub" id="intro"></p>

  <input id="q" type="search" autocomplete="off" autofocus>
  <div class="chips" id="areas"></div>
  <div id="meta"></div>
  <div id="out"></div>

  <footer id="foot"></footer>
</main>

<script>
(async function () {
  "use strict";

  // ---- i18n ----------------------------------------------------------
  // Key-based: add a language by adding one block here (and its label in
  // AREA_LABELS). {n} / {m} are placeholders. Indicator names exist in
  // PT and EN only (that is what PORDATA publishes); other UI languages
  // show the EN name first and the PT original underneath.
  const STRINGS = {
    pt: {
      intro: 'Catálogo pesquisável dos <b>{n}</b> indicadores da {pordata} (Fundação Francisco Manuel dos Santos). Este índice contém apenas <b>metadados</b> — os valores estão nas páginas da PORDATA e nas fontes oficiais (INE, Eurostat, Banco de Portugal).',
      placeholder: 'ex.: envelhecimento, salário médio, rendas…',
      results: '{n} indicadores', showing: ' (a mostrar {m})',
      removed: 'descontinuado', sources: 'Fontes', updated: 'atual.',
      loadfail: 'Não foi possível carregar o catálogo.',
      building: ' (colheita em curso)', updatedAt: 'Atualizado: ',
      foot: 'Dados e curadoria: {pordata}, Fundação Francisco Manuel dos Santos, e respetivas fontes. Índice construído a partir das páginas públicas de indicadores; sem redistribuição de valores. Código e metadados: {repo} · {json} · {csv}',
    },
    en: {
      intro: 'Searchable catalogue of the <b>{n}</b> indicators of {pordata} (Francisco Manuel dos Santos Foundation). This index holds <b>metadata only</b> — the values live on PORDATA\'s pages and at the official sources (INE, Eurostat, Banco de Portugal).',
      placeholder: 'e.g.: ageing, average wage, rents…',
      results: '{n} indicators', showing: ' (showing {m})',
      removed: 'discontinued', sources: 'Sources', updated: 'upd.',
      loadfail: 'Could not load the catalogue.',
      building: ' (harvest in progress)', updatedAt: 'Updated: ',
      foot: 'Data and curation: {pordata}, Francisco Manuel dos Santos Foundation, and their sources. Built from the public indicator pages; no data values are redistributed. Code and metadata: {repo} · {json} · {csv}',
    },
    es: {
      intro: 'Catálogo consultable de los <b>{n}</b> indicadores de {pordata} (Fundación Francisco Manuel dos Santos). Este índice contiene solo <b>metadatos</b>: los valores están en las páginas de PORDATA y en las fuentes oficiales (INE, Eurostat, Banco de Portugal). Los nombres de los indicadores existen en portugués e inglés.',
      placeholder: 'p. ej.: envejecimiento, salario medio, alquileres…',
      results: '{n} indicadores', showing: ' (mostrando {m})',
      removed: 'descatalogado', sources: 'Fuentes', updated: 'act.',
      loadfail: 'No se pudo cargar el catálogo.',
      building: ' (recolección en curso)', updatedAt: 'Actualizado: ',
      foot: 'Datos y curaduría: {pordata}, Fundación Francisco Manuel dos Santos, y sus fuentes. Construido a partir de las páginas públicas de indicadores; sin redistribución de valores. Código y metadatos: {repo} · {json} · {csv}',
    },
    fr: {
      intro: 'Catalogue interrogeable des <b>{n}</b> indicateurs de {pordata} (Fondation Francisco Manuel dos Santos). Cet index ne contient que des <b>métadonnées</b> — les valeurs se trouvent sur les pages de PORDATA et auprès des sources officielles (INE, Eurostat, Banco de Portugal). Les noms des indicateurs existent en portugais et en anglais.',
      placeholder: 'ex. : vieillissement, salaire moyen, loyers…',
      results: '{n} indicateurs', showing: ' (affichage de {m})',
      removed: 'discontinué', sources: 'Sources', updated: 'màj',
      loadfail: 'Impossible de charger le catalogue.',
      building: ' (collecte en cours)', updatedAt: 'Mis à jour : ',
      foot: 'Données et curation : {pordata}, Fondation Francisco Manuel dos Santos, et leurs sources. Construit à partir des pages publiques des indicateurs ; aucune valeur n\'est redistribuée. Code et métadonnées : {repo} · {json} · {csv}',
    },
    de: {
      intro: 'Durchsuchbarer Katalog der <b>{n}</b> Indikatoren von {pordata} (Stiftung Francisco Manuel dos Santos). Dieser Index enthält nur <b>Metadaten</b> — die Werte stehen auf den PORDATA-Seiten und bei den amtlichen Quellen (INE, Eurostat, Banco de Portugal). Die Indikatornamen liegen auf Portugiesisch und Englisch vor.',
      placeholder: 'z. B.: Alterung, Durchschnittslohn, Mieten…',
      results: '{n} Indikatoren', showing: ' (zeige {m})',
      removed: 'eingestellt', sources: 'Quellen', updated: 'Stand',
      loadfail: 'Der Katalog konnte nicht geladen werden.',
      building: ' (Erhebung läuft)', updatedAt: 'Aktualisiert: ',
      foot: 'Daten und Kuratierung: {pordata}, Stiftung Francisco Manuel dos Santos, und ihre Quellen. Erstellt aus den öffentlichen Indikatorseiten; keine Weiterverbreitung von Werten. Code und Metadaten: {repo} · {json} · {csv}',
    },
    it: {
      intro: 'Catalogo consultabile dei <b>{n}</b> indicatori di {pordata} (Fondazione Francisco Manuel dos Santos). Questo indice contiene solo <b>metadati</b>: i valori si trovano sulle pagine di PORDATA e presso le fonti ufficiali (INE, Eurostat, Banco de Portugal). I nomi degli indicatori esistono in portoghese e inglese.',
      placeholder: 'es.: invecchiamento, salario medio, affitti…',
      results: '{n} indicatori', showing: ' (mostrando {m})',
      removed: 'dismesso', sources: 'Fonti', updated: 'agg.',
      loadfail: 'Impossibile caricare il catalogo.',
      building: ' (raccolta in corso)', updatedAt: 'Aggiornato: ',
      foot: 'Dati e cura: {pordata}, Fondazione Francisco Manuel dos Santos, e le rispettive fonti. Costruito dalle pagine pubbliche degli indicatori; nessuna ridistribuzione di valori. Codice e metadati: {repo} · {json} · {csv}',
    },
  };
  const AREA_LABELS = {
    portugal:   {pt: 'Portugal', en: 'Portugal', es: 'Portugal',
                 fr: 'Portugal', de: 'Portugal', it: 'Portogallo'},
    municipios: {pt: 'Municípios', en: 'Municipalities', es: 'Municipios',
                 fr: 'Municipalités', de: 'Gemeinden', it: 'Comuni'},
    europa:     {pt: 'Europa', en: 'Europe', es: 'Europa',
                 fr: 'Europe', de: 'Europa', it: 'Europa'},
  };
  const LINKS = {
    pordata: '<a href="https://www.pordata.pt" rel="noopener">PORDATA</a>',
    repo: '<a href="https://github.com/caasols/pordata" rel="noopener">github.com/caasols/pordata</a>',
    json: '<a href="data/catalogue.json">catalogue.json</a>',
    csv: '<a href="data/catalogue.csv">catalogue.csv</a>',
  };

  function t(key, params) {
    let s = (STRINGS[lang] || STRINGS.pt)[key] || STRINGS.pt[key] || key;
    for (const [k, v] of Object.entries({...LINKS, ...(params || {})}))
      s = s.split("{" + k + "}").join(v);
    return s;
  }

  const $ = (id) => document.getElementById(id);
  const norm = (s) => (s || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  let lang;
  try { lang = localStorage.getItem("lang"); } catch (e) { lang = null; }
  if (!STRINGS[lang]) {
    const nav = (navigator.language || "pt").slice(0, 2).toLowerCase();
    lang = STRINGS[nav] ? nav : "en";
  }

  // ---- theme (shadcn .dark class; system by default, ☾/☀ persists) ---
  const themeBtn = $("themeBtn");
  const root = document.documentElement;
  function setTheme(mode) {
    root.classList.toggle("dark", mode === "dark");
    themeBtn.textContent = mode === "dark" ? "☀" : "☾";
  }
  setTheme(root.classList.contains("dark") ? "dark" : "light");
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
    let s = null;
    try { s = localStorage.getItem("theme"); } catch (_) {}
    if (s !== "dark" && s !== "light") setTheme(e.matches ? "dark" : "light");
  });
  themeBtn.onclick = () => {
    const next = root.classList.contains("dark") ? "light" : "dark";
    try { localStorage.setItem("theme", next); } catch (e) {}
    setTheme(next);
  };

  // ---- data ----------------------------------------------------------
  let rows = [], stats = null;
  try {
    [rows, stats] = await Promise.all([
      fetch("data/catalogue.json").then(r => r.json()),
      fetch("data/stats.json").then(r => r.json()).catch(() => null),
    ]);
  } catch (e) {
    $("out").textContent = t("loadfail");
    return;
  }
  rows.forEach(r => {
    r._name = norm(r.name);
    r._hay = norm([r.name, r.name_en, r.description,
      (r.fontes || []).join(" ")].join(" "));
    r._words = r._hay.split(/[^a-z0-9%€]+/).filter(w => w.length > 1);
  });

  // ---- fuzzy search --------------------------------------------------
  function editDistance(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = Array.from({length: b.length + 1}, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let rowMin = i;
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
          prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (cur[j] < rowMin) rowMin = cur[j];
      }
      if (rowMin > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  function tokenScore(tok, r) {
    if (r._hay.includes(tok)) return r._name.includes(tok) ? 3 : 2;
    if (tok.length < 3) return 0;
    const maxEd = tok.length >= 8 ? 2 : (tok.length >= 5 ? 1 : 0);
    let best = 0;
    for (const w of r._words) {
      if (w.startsWith(tok)) { best = Math.max(best, 1.5); continue; }
      if (maxEd && editDistance(tok, w, maxEd) <= maxEd)
        best = Math.max(best, 1);
      if (best >= 1.5) break;
    }
    return best;
  }

  // ---- rendering -----------------------------------------------------
  const active = new Set(Object.keys(AREA_LABELS));
  const MAX = 60;

  function displayNames(r) {
    const primary = lang === "pt" ? (r.name || r.name_en)
                                  : (r.name_en || r.name);
    const alt = primary === r.name ? r.name_en
              : (r.name && r.name !== primary ? r.name : "");
    return [primary, alt];
  }

  function render() {
    const terms = norm($("q").value).split(/\s+/).filter(Boolean);
    const hits = [];
    for (const r of rows) {
      if (!active.has(r.area)) continue;
      let score = 1;
      for (const term of terms) {
        const s = tokenScore(term, r);
        if (!s) { score = 0; break; }
        score += s;
      }
      if (score) hits.push([score, r]);
    }
    hits.sort((a, b) => b[0] - a[0] || a[1].name.localeCompare(b[1].name));
    $("meta").textContent =
      t("results", {n: hits.length.toLocaleString()}) +
      (hits.length > MAX ? t("showing", {m: MAX}) : "");
    $("out").innerHTML = hits.slice(0, MAX).map(([, r]) => {
      const [primary, alt] = displayNames(r);
      return `
      <div class="card">
        <a class="name" href="${r.url}" rel="noopener">${primary || r.url}</a>
        ${alt ? `<div class="alt">${alt}</div>` : ""}
        <div class="tags">
          <span class="tag">${(AREA_LABELS[r.area] || {})[lang] || r.area}</span>
          ${r.removed ? `<span class="tag removed">${t("removed")}</span>` : ""}
          ${(r.featured || []).map(f => `<span class="tag">★ ${f}</span>`).join("")}
          ${r.fontes && r.fontes.length ? `<span class="tag outline">${t("sources")}: ` +
            r.fontes.join(", ") + "</span>" : ""}
          ${r.ultima_atualizacao ? `<span class="tag outline">${t("updated")} ` +
            r.ultima_atualizacao + "</span>" : ""}
        </div>
        ${(lang === "pt" && r.description)
          ? `<p class="desc">${r.description}</p>` : ""}
      </div>`;
    }).join("");
  }

  function applyLang() {
    document.documentElement.lang = lang;
    $("intro").innerHTML = t("intro", {n: rows.length.toLocaleString()});
    $("q").placeholder = t("placeholder");
    $("foot").innerHTML = t("foot") + (stats
      ? `<div>${t("updatedAt")}${stats.built_at}${stats.complete ? "" : t("building")}</div>`
      : "");
    $("lang").innerHTML = Object.keys(STRINGS).map(l =>
      `<span class="${l === lang ? "on" : ""}" data-l="${l}">${l.toUpperCase()}</span>`
    ).join("");
    for (const el of $("lang").children) {
      el.onclick = () => {
        lang = el.dataset.l;
        try { localStorage.setItem("lang", lang); } catch (e) {}
        applyLang(); buildAreaChips(); render();
      };
    }
  }

  function buildAreaChips() {
    const box = $("areas");
    box.innerHTML = "";
    for (const key of Object.keys(AREA_LABELS)) {
      const el = document.createElement("span");
      el.className = "chip" + (active.has(key) ? " on" : "");
      el.textContent = AREA_LABELS[key][lang] || key;
      el.onclick = () => {
        if (active.has(key) && active.size === 1) return;
        active.has(key) ? active.delete(key) : active.add(key);
        el.classList.toggle("on", active.has(key));
        render();
      };
      box.appendChild(el);
    }
  }

  let timer = null;
  $("q").addEventListener("input", () => {
    clearTimeout(timer); timer = setTimeout(render, 120);
  });
  applyLang(); buildAreaChips(); render();
})();
</script>
</body>
</html>
