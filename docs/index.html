<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pordata map — catálogo de indicadores</title>
<meta name="description" content="Catálogo pesquisável dos indicadores da PORDATA. Apenas metadados; os valores estão na PORDATA e nas fontes oficiais.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  /* set theme before first paint to avoid a flash */
  try {
    var t = localStorage.getItem("theme");
    if (t === "dark" || (t !== "light" &&
        matchMedia("(prefers-color-scheme: dark)").matches))
      document.documentElement.classList.add("dark");
  } catch (e) {}
</script>
<style>
  /* ---- shadcn theme tokens --------------------------------------------
     Preset b1FQyVz3C from ui.shadcn.com/create (amber, Public Sans,
     radius 0.45rem), extracted from the live preview 2026-08-22. To
     re-theme, replace the :root and .dark blocks; values are complete
     colors (oklch/lab), consumed via var() directly. */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.147 0.004 49.25);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.147 0.004 49.25);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.147 0.004 49.25);
    --primary: oklch(0.555 0.163 48.998);
    --primary-foreground: oklch(0.987 0.022 95.277);
    --secondary: oklch(0.967 0.001 286.375);
    --secondary-foreground: oklch(0.21 0.006 285.885);
    --muted: oklch(0.97 0.001 106.424);
    --muted-foreground: oklch(0.553 0.013 58.071);
    --accent: oklch(0.97 0.001 106.424);
    --accent-foreground: oklch(0.216 0.006 56.043);
    --destructive: oklch(0.577 0.245 27.325);
    --destructive-foreground: lab(96.4152% 3.22586 1.14673);
    --border: oklch(0.923 0.003 48.717);
    --input: oklch(0.923 0.003 48.717);
    --ring: oklch(0.709 0.01 56.259);
    --chart-1: oklch(0.879 0.169 91.605);
    --chart-2: oklch(0.769 0.188 70.08);
    --chart-3: oklch(0.666 0.179 58.318);
    --chart-4: oklch(0.555 0.163 48.998);
    --chart-5: oklch(0.473 0.137 46.201);
    --radius: 0.45rem;
    --font-sans: "Public Sans", ui-sans-serif, system-ui, -apple-system,
      "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .dark {
    --background: oklch(0.147 0.004 49.25);
    --foreground: oklch(0.985 0.001 106.423);
    --card: oklch(0.216 0.006 56.043);
    --card-foreground: oklch(0.985 0.001 106.423);
    --popover: oklch(0.216 0.006 56.043);
    --popover-foreground: oklch(0.985 0.001 106.423);
    --primary: oklch(0.473 0.137 46.201);
    --primary-foreground: oklch(0.987 0.022 95.277);
    --secondary: oklch(0.274 0.006 286.033);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.268 0.007 34.298);
    --muted-foreground: oklch(0.709 0.01 56.259);
    --accent: oklch(0.268 0.007 34.298);
    --accent-foreground: oklch(0.985 0.001 106.423);
    --destructive: oklch(0.704 0.191 22.216);
    --destructive-foreground: oklch(0.987 0.022 95.277);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.553 0.013 58.071);
  }

  /* ---- base ---- */
  * { box-sizing: border-box; border-color: var(--border); }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--background); color: var(--foreground);
    font: 15px/1.6 var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 768px; margin: 0 auto; padding: 28px 16px 64px; }
  a { color: inherit; }

  /* ---- header ---- */
  .top { display: flex; align-items: center; justify-content: space-between;
         flex-wrap: nowrap; gap: 10px; margin-bottom: 6px; }
  h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em;
       margin: 0; min-width: 0; }
  h1 a { text-decoration: none; }
  .controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  /* lang picker: shadcn select (collapsed shows current language only) */
  .langWrap { position: relative; }
  #langBtn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 2.1rem; padding: 0 10px; border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 2px); background: transparent;
    color: var(--foreground); cursor: pointer;
    font: inherit; font-size: .8rem; font-weight: 500;
  }
  #langBtn:hover { background: var(--accent); color: var(--accent-foreground); }
  #langBtn svg { width: .85rem; height: .85rem; color: var(--muted-foreground); }
  #langMenu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 50;
    min-width: 5.5rem; padding: 4px;
    background: var(--popover); color: var(--popover-foreground);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 4px 16px rgb(0 0 0 / 0.12);
  }
  .langItem {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 6px 10px; font-size: .85rem; cursor: pointer;
    border-radius: calc(var(--radius) - 4px); user-select: none;
  }
  .langItem:hover { background: var(--accent); color: var(--accent-foreground); }
  .langItem svg { width: .9rem; height: .9rem; }
  .langItem.disabled {
    opacity: .4; cursor: not-allowed;
  }
  .langItem.disabled:hover { background: transparent; color: inherit; }
  #langMenu { max-height: 60vh; overflow-y: auto; }

  /* theme toggle: shadcn ghost icon button */
  #themeBtn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 2.1rem; width: 2.1rem; border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 2px); background: transparent;
    color: var(--muted-foreground); cursor: pointer; font-size: 1rem;
  }
  #themeBtn:hover { background: var(--accent); color: var(--accent-foreground); }
  #themeBtn svg { width: 1.05rem; height: 1.05rem; }
  #themeBtn .icon-sun { display: none; }
  .dark #themeBtn .icon-sun { display: block; }
  .dark #themeBtn .icon-moon { display: none; }

  .sub { color: var(--muted-foreground); margin: 8px 0 20px; font-size: .92rem; }
  .sub b { color: var(--foreground); font-weight: 600; }
  .sub a { color: var(--foreground); text-underline-offset: 3px; }

  /* ---- input: shadcn input ---- */
  #q {
    width: 100%; height: 2.75rem; padding: 0 14px; font-size: 1rem;
    font-family: inherit; color: var(--foreground);
    background: var(--background);
    border: 1px solid var(--input);
    border-radius: calc(var(--radius) - 2px); outline: none;
  }
  #q::placeholder { color: var(--muted-foreground); }
  #q:focus-visible {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 30%, transparent);
  }

  /* ---- area filters: shadcn toggle badges ---- */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; }
  .chip {
    padding: 4px 12px; border-radius: 999px; font-size: .82rem; font-weight: 500;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted-foreground); cursor: pointer; user-select: none;
  }
  .chip:hover { background: var(--accent); color: var(--accent-foreground); }
  .chip.on {
    background: var(--primary); border-color: var(--primary);
    color: var(--primary-foreground);
  }

  #meta { color: var(--muted-foreground); font-size: .82rem; margin: 12px 2px; }

  /* ---- results: shadcn cards ---- */
  .card {
    background: var(--card); color: var(--card-foreground);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin: 10px 0;
    box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.04);
    overflow-wrap: anywhere; /* long slugs/URLs must never widen the page */
  }
  .card a.name {
    color: var(--primary);
    font-weight: 600; font-size: .98rem; text-decoration: none;
    text-underline-offset: 3px;
  }
  .card a.name:hover { text-decoration: underline; }
  .alt { font-size: .84rem; color: var(--muted-foreground); margin-top: 2px; }
  .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    display: inline-flex; align-items: center;
    background: var(--secondary); color: var(--secondary-foreground);
    border-radius: calc(var(--radius) - 4px);
    padding: 2px 8px; font-size: .74rem; font-weight: 500;
  }
  .tag.removed { background: var(--destructive); color: var(--destructive-foreground); }
  .tag.outline {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted-foreground); font-weight: 400;
  }
  .desc { margin: 8px 0 0; font-size: .88rem; color: var(--muted-foreground); }

  footer {
    margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--border);
    color: var(--muted-foreground); font-size: .82rem;
  }
  footer a { color: var(--foreground); text-underline-offset: 3px; }
  footer div { margin-top: 6px; }
  .credit { margin-top: 10px; }
  .credit .heart { color: var(--primary); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1><a href="./">pordata map</a></h1>
    <div class="controls">
      <div class="langWrap" id="langWrap">
        <button id="langBtn" aria-haspopup="listbox" aria-expanded="false">
          <span id="langLabel"></span>
          <!-- lucide "chevron-down" -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="langMenu" role="listbox" hidden></div>
      </div>
      <button id="themeBtn" aria-label="Light/dark theme">
        <!-- lucide "sun" / "moon" (ISC), shown per theme via CSS -->
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </div>
  <p class="sub" id="intro"></p>

  <input id="q" type="search" autocomplete="off" autofocus>
  <div class="chips" id="areas"></div>
  <div id="meta"></div>
  <div id="out"></div>

  <footer id="foot"></footer>
</main>

<script>
(async function () {
  "use strict";

  // ---- i18n ----------------------------------------------------------
  // Key-based: add a language by adding one block here (and its label in
  // AREA_LABELS). {n} / {m} are placeholders. Indicator names exist in
  // PT and EN only (that is what PORDATA publishes); other UI languages
  // show the EN name first and the PT original underneath.
  const STRINGS = {
    pt: {
      intro: 'Catálogo pesquisável dos <b>{n}</b> indicadores da {pordata} (Fundação Francisco Manuel dos Santos). Este índice contém apenas <b>metadados</b> — os valores estão nas páginas da PORDATA e nas fontes oficiais (INE, Eurostat, Banco de Portugal).',
      placeholder: 'ex.: envelhecimento, salário médio, rendas…',
      results: '{n} indicadores', showing: ' (a mostrar {m})',
      removed: 'descontinuado', sources: 'Fontes', updated: 'atual.',
      loadfail: 'Não foi possível carregar o catálogo.',
      building: ' (colheita em curso)', updatedAt: 'Atualizado: ',
      foot: 'Dados e curadoria: {pordata}, Fundação Francisco Manuel dos Santos, e respetivas fontes. Índice construído a partir das páginas públicas de indicadores; sem redistribuição de valores. Código e metadados: {repo} · {json} · {csv}',
    },
    en: {
      intro: 'Searchable catalogue of the <b>{n}</b> indicators of {pordata} (Francisco Manuel dos Santos Foundation). This index holds <b>metadata only</b> — the values live on PORDATA\'s pages and at the official sources (INE, Eurostat, Banco de Portugal).',
      placeholder: 'e.g.: ageing, average wage, rents…',
      results: '{n} indicators', showing: ' (showing {m})',
      removed: 'discontinued', sources: 'Sources', updated: 'upd.',
      loadfail: 'Could not load the catalogue.',
      building: ' (harvest in progress)', updatedAt: 'Updated: ',
      foot: 'Data and curation: {pordata}, Francisco Manuel dos Santos Foundation, and their sources. Built from the public indicator pages; no data values are redistributed. Code and metadata: {repo} · {json} · {csv}',
    },
    es: {
      intro: 'Catálogo consultable de los <b>{n}</b> indicadores de {pordata} (Fundación Francisco Manuel dos Santos). Este índice contiene solo <b>metadatos</b>: los valores están en las páginas de PORDATA y en las fuentes oficiales (INE, Eurostat, Banco de Portugal). Los nombres de los indicadores existen en portugués e inglés.',
      placeholder: 'p. ej.: envejecimiento, salario medio, alquileres…',
      results: '{n} indicadores', showing: ' (mostrando {m})',
      removed: 'descatalogado', sources: 'Fuentes', updated: 'act.',
      loadfail: 'No se pudo cargar el catálogo.',
      building: ' (recolección en curso)', updatedAt: 'Actualizado: ',
      foot: 'Datos y curaduría: {pordata}, Fundación Francisco Manuel dos Santos, y sus fuentes. Construido a partir de las páginas públicas de indicadores; sin redistribución de valores. Código y metadatos: {repo} · {json} · {csv}',
    },
    fr: {
      intro: 'Catalogue interrogeable des <b>{n}</b> indicateurs de {pordata} (Fondation Francisco Manuel dos Santos). Cet index ne contient que des <b>métadonnées</b> — les valeurs se trouvent sur les pages de PORDATA et auprès des sources officielles (INE, Eurostat, Banco de Portugal). Les noms des indicateurs existent en portugais et en anglais.',
      placeholder: 'ex. : vieillissement, salaire moyen, loyers…',
      results: '{n} indicateurs', showing: ' (affichage de {m})',
      removed: 'discontinué', sources: 'Sources', updated: 'màj',
      loadfail: 'Impossible de charger le catalogue.',
      building: ' (collecte en cours)', updatedAt: 'Mis à jour : ',
      foot: 'Données et curation : {pordata}, Fondation Francisco Manuel dos Santos, et leurs sources. Construit à partir des pages publiques des indicateurs ; aucune valeur n\'est redistribuée. Code et métadonnées : {repo} · {json} · {csv}',
    },
    de: {
      intro: 'Durchsuchbarer Katalog der <b>{n}</b> Indikatoren von {pordata} (Stiftung Francisco Manuel dos Santos). Dieser Index enthält nur <b>Metadaten</b> — die Werte stehen auf den PORDATA-Seiten und bei den amtlichen Quellen (INE, Eurostat, Banco de Portugal). Die Indikatornamen liegen auf Portugiesisch und Englisch vor.',
      placeholder: 'z. B.: Alterung, Durchschnittslohn, Mieten…',
      results: '{n} Indikatoren', showing: ' (zeige {m})',
      removed: 'eingestellt', sources: 'Quellen', updated: 'Stand',
      loadfail: 'Der Katalog konnte nicht geladen werden.',
      building: ' (Erhebung läuft)', updatedAt: 'Aktualisiert: ',
      foot: 'Daten und Kuratierung: {pordata}, Stiftung Francisco Manuel dos Santos, und ihre Quellen. Erstellt aus den öffentlichen Indikatorseiten; keine Weiterverbreitung von Werten. Code und Metadaten: {repo} · {json} · {csv}',
    },
    it: {
      intro: 'Catalogo consultabile dei <b>{n}</b> indicatori di {pordata} (Fondazione Francisco Manuel dos Santos). Questo indice contiene solo <b>metadati</b>: i valori si trovano sulle pagine di PORDATA e presso le fonti ufficiali (INE, Eurostat, Banco de Portugal). I nomi degli indicatori esistono in portoghese e inglese.',
      placeholder: 'es.: invecchiamento, salario medio, affitti…',
      results: '{n} indicatori', showing: ' (mostrando {m})',
      removed: 'dismesso', sources: 'Fonti', updated: 'agg.',
      loadfail: 'Impossibile caricare il catalogo.',
      building: ' (raccolta in corso)', updatedAt: 'Aggiornato: ',
      foot: 'Dati e cura: {pordata}, Fondazione Francisco Manuel dos Santos, e le rispettive fonti. Costruito dalle pagine pubbliche degli indicatori; nessuna ridistribuzione di valori. Codice e metadati: {repo} · {json} · {csv}',
    },
  };
  const AREA_LABELS = {
    portugal:   {pt: 'Portugal', en: 'Portugal', es: 'Portugal',
                 fr: 'Portugal', de: 'Portugal', it: 'Portogallo'},
    municipios: {pt: 'Municípios', en: 'Municipalities', es: 'Municipios',
                 fr: 'Municipalités', de: 'Gemeinden', it: 'Comuni'},
    europa:     {pt: 'Europa', en: 'Europe', es: 'Europa',
                 fr: 'Europe', de: 'Europa', it: 'Europa'},
  };
  const LINKS = {
    pordata: '<a href="https://www.pordata.pt" rel="noopener">PORDATA</a>',
    repo: '<a href="https://github.com/caasols/pordata" rel="noopener">github.com/caasols/pordata</a>',
    json: '<a href="data/catalogue.json">catalogue.json</a>',
    csv: '<a href="data/catalogue.csv">catalogue.csv</a>',
  };

  function t(key, params) {
    let s = (STRINGS[lang] || STRINGS.pt)[key] || STRINGS.pt[key] || key;
    for (const [k, v] of Object.entries({...LINKS, ...(params || {})}))
      s = s.split("{" + k + "}").join(v);
    return s;
  }

  const $ = (id) => document.getElementById(id);
  const norm = (s) => (s || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  // Selectable today: content (indicator names) exists in PT and EN only.
  // The dropdown lists all EU languages; the rest are greyed out until
  // their UI strings and content story are ready (then add them here).
  const AVAILABLE = new Set(["pt", "en"]);
  let lang;
  try { lang = localStorage.getItem("lang"); } catch (e) { lang = null; }
  if (!AVAILABLE.has(lang)) {
    const nav = (navigator.language || "pt").slice(0, 2).toLowerCase();
    lang = AVAILABLE.has(nav) ? nav : "en";
  }

  // ---- theme (shadcn .dark class; system by default, ☾/☀ persists) ---
  const themeBtn = $("themeBtn");
  const root = document.documentElement;
  function setTheme(mode) {
    root.classList.toggle("dark", mode === "dark");
  }
  setTheme(root.classList.contains("dark") ? "dark" : "light");
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
    let s = null;
    try { s = localStorage.getItem("theme"); } catch (_) {}
    if (s !== "dark" && s !== "light") setTheme(e.matches ? "dark" : "light");
  });
  themeBtn.onclick = () => {
    const next = root.classList.contains("dark") ? "light" : "dark";
    try { localStorage.setItem("theme", next); } catch (e) {}
    setTheme(next);
  };

  // ---- data ----------------------------------------------------------
  let rows = [], stats = null;
  try {
    [rows, stats] = await Promise.all([
      fetch("data/catalogue.json").then(r => r.json()),
      fetch("data/stats.json").then(r => r.json()).catch(() => null),
    ]);
  } catch (e) {
    $("out").textContent = t("loadfail");
    return;
  }
  rows.forEach(r => {
    r._name = norm(r.name);
    r._hay = norm([r.name, r.name_en, r.description,
      (r.fontes || []).join(" ")].join(" "));
    r._words = r._hay.split(/[^a-z0-9%€]+/).filter(w => w.length > 1);
  });

  // ---- fuzzy search --------------------------------------------------
  function editDistance(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = Array.from({length: b.length + 1}, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let rowMin = i;
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
          prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (cur[j] < rowMin) rowMin = cur[j];
      }
      if (rowMin > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  function tokenScore(tok, r) {
    if (r._hay.includes(tok)) return r._name.includes(tok) ? 3 : 2;
    if (tok.length < 3) return 0;
    const maxEd = tok.length >= 8 ? 2 : (tok.length >= 5 ? 1 : 0);
    let best = 0;
    for (const w of r._words) {
      if (w.startsWith(tok)) { best = Math.max(best, 1.5); continue; }
      if (maxEd && editDistance(tok, w, maxEd) <= maxEd)
        best = Math.max(best, 1);
      if (best >= 1.5) break;
    }
    return best;
  }

  // ---- rendering -----------------------------------------------------
  // Area chips are opt-in filters: none selected means show everything.
  const active = new Set();
  const MAX = 60;

  function displayNames(r) {
    const primary = lang === "pt" ? (r.name || r.name_en)
                                  : (r.name_en || r.name);
    const alt = primary === r.name ? r.name_en
              : (r.name && r.name !== primary ? r.name : "");
    return [primary, alt];
  }

  function render() {
    const terms = norm($("q").value).split(/\s+/).filter(Boolean);
    const hits = [];
    for (const r of rows) {
      if (active.size && !active.has(r.area)) continue;
      let score = 1;
      for (const term of terms) {
        const s = tokenScore(term, r);
        if (!s) { score = 0; break; }
        score += s;
      }
      if (score) hits.push([score, r]);
    }
    hits.sort((a, b) => b[0] - a[0] || a[1].name.localeCompare(b[1].name));
    $("meta").textContent =
      t("results", {n: hits.length.toLocaleString()}) +
      (hits.length > MAX ? t("showing", {m: MAX}) : "");
    $("out").innerHTML = hits.slice(0, MAX).map(([, r]) => {
      const [primary, alt] = displayNames(r);
      return `
      <div class="card">
        <a class="name" href="${r.url}" rel="noopener">${primary || r.url}</a>
        ${alt ? `<div class="alt">${alt}</div>` : ""}
        <div class="tags">
          <span class="tag">${(AREA_LABELS[r.area] || {})[lang] || r.area}</span>
          ${r.removed ? `<span class="tag removed">${t("removed")}</span>` : ""}
          ${(r.featured || []).map(f => `<span class="tag">★ ${f}</span>`).join("")}
          ${r.fontes && r.fontes.length ? `<span class="tag outline">${t("sources")}: ` +
            r.fontes.join(", ") + "</span>" : ""}
          ${r.ultima_atualizacao ? `<span class="tag outline">${t("updated")} ` +
            r.ultima_atualizacao + "</span>" : ""}
        </div>
        ${(lang === "pt" && r.description)
          ? `<p class="desc">${r.description}</p>` : ""}
      </div>`;
    }).join("");
  }

  function applyLang() {
    document.documentElement.lang = lang;
    $("intro").innerHTML = t("intro", {n: rows.length.toLocaleString()});
    $("q").placeholder = t("placeholder");
    $("foot").innerHTML = t("foot") + (stats
      ? `<div>${t("updatedAt")}${stats.built_at}${stats.complete ? "" : t("building")}</div>`
      : "") +
      `<div class="credit">Made with <span class="heart">&#9829;</span> by ` +
      `<a href="https://benevol.us" target="_blank" rel="noopener">Benevolus</a> studio</div>`;
    renderLangUI();
  }

  // ---- language dropdown (shadcn select) ----
  // All EU official languages, native names; available ones first.
  const ALL_LANGS = [
    ["pt", "Português"], ["en", "English"], ["bg", "Български"],
    ["cs", "Čeština"], ["da", "Dansk"], ["de", "Deutsch"],
    ["el", "Ελληνικά"], ["es", "Español"], ["et", "Eesti"],
    ["fi", "Suomi"], ["fr", "Français"], ["ga", "Gaeilge"],
    ["hr", "Hrvatski"], ["hu", "Magyar"], ["it", "Italiano"],
    ["lt", "Lietuvių"], ["lv", "Latviešu"], ["mt", "Malti"],
    ["nl", "Nederlands"], ["pl", "Polski"], ["ro", "Română"],
    ["sk", "Slovenčina"], ["sl", "Slovenščina"], ["sv", "Svenska"],
  ];
  const CHECK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const langBtn = $("langBtn"), langMenu = $("langMenu");

  function renderLangUI() {
    $("langLabel").textContent = lang.toUpperCase();
    langMenu.innerHTML = ALL_LANGS.map(([l, name]) => {
      const ok = AVAILABLE.has(l);
      return `
      <div class="langItem${ok ? "" : " disabled"}" role="option"
           data-l="${l}" aria-selected="${l === lang}" title="${name}"
           aria-label="${name}" ${ok ? "" : 'aria-disabled="true"'}>
        <span>${l.toUpperCase()}</span>
        ${l === lang ? CHECK_SVG : ""}
      </div>`;
    }).join("");
    for (const el of langMenu.children) {
      if (el.classList.contains("disabled")) continue;
      el.onclick = () => {
        lang = el.dataset.l;
        try { localStorage.setItem("lang", lang); } catch (e) {}
        toggleLangMenu(false);
        applyLang(); buildAreaChips(); render();
      };
    }
  }
  function toggleLangMenu(open) {
    langMenu.hidden = !open;
    langBtn.setAttribute("aria-expanded", String(open));
  }
  langBtn.onclick = (e) => { e.stopPropagation(); toggleLangMenu(langMenu.hidden); };
  document.addEventListener("click", (e) => {
    if (!langMenu.hidden && !e.target.closest("#langWrap")) toggleLangMenu(false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") toggleLangMenu(false);
  });

  function buildAreaChips() {
    const box = $("areas");
    box.innerHTML = "";
    for (const key of Object.keys(AREA_LABELS)) {
      const el = document.createElement("span");
      el.className = "chip" + (active.has(key) ? " on" : "");
      el.textContent = AREA_LABELS[key][lang] || key;
      el.onclick = () => {
        active.has(key) ? active.delete(key) : active.add(key);
        el.classList.toggle("on", active.has(key));
        render();
      };
      box.appendChild(el);
    }
  }

  let timer = null;
  $("q").addEventListener("input", () => {
    clearTimeout(timer); timer = setTimeout(render, 120);
  });
  applyLang(); buildAreaChips(); render();
})();
</script>
</body>
</html>
