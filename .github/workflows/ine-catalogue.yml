name: ine catalogue snapshot

# Phase B: one-shot cache of the INE indicator catalogue (spike A2).
# Manual dispatch only — INE's bot protection 403s repeat pulls from
# cloud IPs, so this is fetched rarely and served from the repo cache.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ine-catalogue
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # branch head at RUN time, not the trigger-time sha —
          # a queued run must not work from a stale snapshot
          ref: ${{ github.ref_name }}

      - name: Fetch and parse INE catalogue
        run: python3 scripts/fetch_ine_catalogue.py

      # The crosswalk is built from this cache, so a refreshed catalogue
      # that did not rebuild it would leave the routing pointing at the
      # previous snapshot's ids with nothing saying so.
      - name: Rebuild the INE crosswalk
        run: python3 scripts/build_crosswalk.py --strict

      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ine/ data/crosswalk/
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "data: INE catalogue snapshot $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
