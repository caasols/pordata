name: ine catalogue snapshot

# Phase B: one-shot cache of the INE indicator catalogue (spike A2).
# Manual dispatch only — INE's bot protection 403s repeat pulls from
# cloud IPs, so this is fetched rarely and served from the repo cache.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One group across every workflow that writes the derived artifacts —
  # harvest, both catalogue refreshes and the featured rebuild all stage
  # `docs/` or `data/crosswalk/`. They sat in four separate groups, so a
  # manual dispatch overlapping the nightly could discard one side's work
  # behind a red run that opens no issue. Serialised rather than
  # cancelled: each of these produces something worth waiting for.
  group: repo-data-write
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # branch head at RUN time, not the trigger-time sha —
          # a queued run must not work from a stale snapshot
          ref: ${{ github.ref_name }}

      - name: Fetch and parse INE catalogue
        run: python3 scripts/fetch_ine_catalogue.py

      # The crosswalk is built from this cache, so a refreshed catalogue
      # that did not rebuild it would leave the routing pointing at the
      # previous snapshot's ids with nothing saying so.
      - name: Rebuild the INE crosswalk
        run: |
          python3 scripts/build_crosswalk.py --strict
          python3 scripts/coverage_gap.py

      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The three files this fetcher writes, not all of data/ine/:
          # the daily availability probe owns availability.csv in
          # the same directory, and a broad add makes two
          # workflows writers of one file for no reason.
          git add data/ine/catalogue.xml.gz data/ine/indicators.csv \
                  data/ine/SUMMARY.md data/crosswalk/ data/coverage/
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "data: INE catalogue snapshot $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
