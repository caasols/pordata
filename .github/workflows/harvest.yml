name: catalogue harvest

# Harvest PORDATA indicator metadata (metadata only, never data values)
# at one request per 20 seconds. Each run is a resumable chunk capped at
# 4.5h working, in order: sitemap-new pages, errored-page retries, stale
# re-fetches (lastmod past harvested_at). With the initial harvest done
# (2026-08-23) the cron IS the maintenance loop - keep it enabled; runs
# with nothing to do no-op in seconds.

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Cap pages this run (empty = time-limited only)"
        required: false
        default: ""
  schedule:
    - cron: "45 1,9,17 * * *"

permissions:
  contents: write

concurrency:
  group: catalogue-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          # branch head at RUN time, not the trigger-time sha —
          # a queued run must not work from a stale snapshot
          ref: ${{ github.ref_name }}

      - name: Harvest chunk
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
        run: python3 scripts/harvest_catalogue.py

      - name: Build catalogue and QA
        run: |
          python3 scripts/build_catalogue.py
          python3 scripts/qa_catalogue.py

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue/ docs/data/
          if git diff --cached --quiet; then
            echo "No new pages harvested."
          else
            git commit -m "data: catalogue harvest chunk $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
