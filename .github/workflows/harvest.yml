name: catalogue harvest

# Harvest PORDATA indicator metadata (metadata only, never data values)
# at one request per 20 seconds. Each run is a resumable chunk capped at
# 4.5h working, in order: sitemap-new pages, errored-page retries, stale
# re-fetches (lastmod past harvested_at). Initial harvest done 2026-08-23;
# since then this is the worker in a detector->worker pair: sitemap.yml
# dispatches it whenever its fresh snapshot leaves pending work. The
# nightly cron is only a safety net for missed dispatches - keep it.

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Cap pages this run (empty = time-limited only)"
        required: false
        default: ""
  schedule:
    - cron: "45 1 * * *"

permissions:
  contents: write
  issues: write  # QA-gate breach opens an issue

concurrency:
  # One group across every workflow that writes the derived artifacts —
  # harvest, both catalogue refreshes and the featured rebuild all stage
  # `docs/` or `data/crosswalk/`. They sat in four separate groups, so a
  # manual dispatch overlapping the nightly could discard one side's work
  # behind a red run that opens no issue. Serialised rather than
  # cancelled: each of these produces something worth waiting for.
  group: repo-data-write
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          # branch head at RUN time, not the trigger-time sha —
          # a queued run must not work from a stale snapshot
          ref: ${{ github.ref_name }}

      - name: Harvest chunk
        id: fetch
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
        run: python3 scripts/harvest_catalogue.py

      # Rebuild only when the harvest changed records; otherwise a no-op
      # run (e.g. a failed retry of the same error) would still commit a
      # stats.json built_at bump and redeploy Pages for nothing.
      # QA runs --strict: a threshold breach (parser regression, corrupt
      # JSONL, mass record loss) must NOT reach the published site.
      - name: Build catalogue and QA gate
        id: qa
        continue-on-error: true
        run: |
          # Every path out of this step must name itself, including the
          # ones nobody wrote. The runner uses `bash -e`, so an exception
          # in build_catalogue.py below aborted the script before any
          # `echo status=` — leaving the output unset, which is falsy for
          # all seven `if:` conditions that read it. The result was the
          # whole publish chain quietly doing nothing while
          # `continue-on-error` kept the job green. An unnamed failure is
          # the one state that must never be silent.
          trap 'echo "status=error" >> "$GITHUB_OUTPUT"' ERR
          if git diff --quiet data/catalogue/; then
            # No new records, so nothing to rebuild — but the gate still
            # runs. Its thresholds are not all about the catalogue:
            # `detail_pages_missing`, `ine_matched`, `eurostat_matched`
            # and `jsonl_value_leak` are filesystem and JSON checks over
            # artifacts a *previous* run wrote, and this is the path the
            # steady-state nightly takes — the harvest is complete, so
            # every ordinary night lands here. Skipping the gate meant
            # the one recurring job that could notice a derived artifact
            # going missing was the one job that never looked.
            echo "No records changed; skipping rebuild, still checking."
            python3 scripts/qa_catalogue.py --strict
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/build_catalogue.py
          if python3 scripts/qa_catalogue.py --strict; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # The harvest itself is still worth keeping (raw records + the QA
      # report explaining the breach); only the publish is withheld.
      - name: Withhold publish on QA breach
        if: steps.qa.outputs.status == 'fail' || steps.qa.outputs.status == 'error'
        run: |
          echo "QA gate breached or the build died - reverting docs/."
          # docs/, not docs/data: build_catalogue.py writes catalogue.json
          # and stats.json at different points, so a crash between them
          # leaves a torn pair, and the detail pages under
          # docs/indicador/ are derived from the same catalogue.
          git checkout -- docs/ || true

      # After the QA gate and its revert, not before: the crosswalk is
      # built from docs/data/catalogue.json, so building it on a
      # catalogue that QA is about to withdraw would publish the
      # degraded version's routing. `pass` only — a skipped rebuild
      # means the catalogue did not change, and so neither can this.
      - name: Rebuild the INE crosswalk
        if: steps.qa.outputs.status == 'pass'
        run: python3 scripts/build_crosswalk.py --strict

      # The other half of the routing, and a separate script because the
      # relation has a different shape: Eurostat publishes cubes, not
      # pre-sliced series, so its candidates are rivals where INE's were
      # a family. Refuses to overwrite its own output on a collapse
      # rather than writing and then failing.
      - name: Rebuild the Eurostat crosswalk
        if: steps.qa.outputs.status == 'pass'
        run: python3 scripts/build_eurostat_crosswalk.py

      # Reads the crosswalk it just rebuilt, to state its reach honestly
      # rather than subtract it: the series-level complement is not
      # computable at 8% recall, so the report works at concept level.
      - name: Recompute the INE coverage gap
        if: steps.qa.outputs.status == 'pass'
        run: python3 scripts/coverage_gap.py

      # Last of the three, because it renders the crosswalk as
      # provenance: building before it would show the previous run's
      # routing on this run's pages. Writes only the pages whose bytes
      # changed, so a harvest that touched five indicators commits five
      # files rather than 2,195.
      - name: Rebuild the indicator detail pages
        id: pages
        if: steps.qa.outputs.status == 'pass'
        run: python3 scripts/build_detail_pages.py --strict

      # always(), because the harvester checkpoints every 25 pages and a
      # skipped commit throws all of it away: a crash or timeout used to
      # cost the whole chunk, which at 20s per page is hours of polite
      # requests re-made for nothing. When the fetch died, build+QA never
      # ran, so docs/data is untouched and only raw records are committed
      # — a partial harvest can never publish a degraded catalogue.
      - name: Commit progress
        if: always()
        env:
          QA_STATUS: ${{ steps.qa.outputs.status }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Raw records always: they are the checkpoints this step exists
          # to save. `docs/` only when the derived builders actually ran
          # and succeeded — the four of them are gated on `pass`, so a
          # floor breach in any one used to leave the catalogue published
          # with its crosswalks and detail pages a run behind, and every
          # card links to a page that would not be there.
          git add data/catalogue/
          if [ "$QA_STATUS" = "pass" ] && [ "$PAGES_OUTCOME" = "success" ]; then
            git add data/crosswalk/ data/coverage/ docs/
          else
            echo "Derived artifacts incomplete (qa=$QA_STATUS pages=$PAGES_OUTCOME); committing raw records only."
            git checkout -- docs/ || true
          fi
          if git diff --cached --quiet; then
            echo "No new pages harvested."
          else
            if [ "${{ steps.fetch.outcome }}" = "success" ]; then
              SUFFIX=""
            else
              SUFFIX=" (partial: the run did not finish)"
            fi
            git commit -m "data: catalogue harvest chunk $(date -u +%Y-%m-%dT%H:%M)${SUFFIX}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Open an issue on QA breach
        if: steps.qa.outputs.status == 'fail' || steps.qa.outputs.status == 'error'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "QA gate breached - publish withheld ($(date -u +%Y-%m-%d))" \
            --body "$(printf 'The harvest QA gate failed or the build died, so `docs/` was NOT published; the raw harvest and the QA report were still committed.\n\nSee `data/catalogue/QA.md` (Gate section) and run %s/actions/runs/%s.\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"

      # 'error' as well as 'fail': a build that died is not a build that
      # passed, and the job must not be green either way.
      - name: Fail the job when the QA gate breached
        if: steps.qa.outputs.status == 'fail' || steps.qa.outputs.status == 'error'
        run: exit 1
