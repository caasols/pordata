name: catalogue harvest

# Harvest PORDATA indicator metadata (metadata only, never data values)
# at one request per 20 seconds. Each run is a resumable chunk capped at
# 4.5h working, in order: sitemap-new pages, errored-page retries, stale
# re-fetches (lastmod past harvested_at). Initial harvest done 2026-08-23;
# since then this is the worker in a detector->worker pair: sitemap.yml
# dispatches it whenever its fresh snapshot leaves pending work. The
# nightly cron is only a safety net for missed dispatches - keep it.

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Cap pages this run (empty = time-limited only)"
        required: false
        default: ""
  schedule:
    - cron: "45 1 * * *"

permissions:
  contents: write
  issues: write  # QA-gate breach opens an issue

concurrency:
  group: catalogue-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          # branch head at RUN time, not the trigger-time sha —
          # a queued run must not work from a stale snapshot
          ref: ${{ github.ref_name }}

      - name: Harvest chunk
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
        run: python3 scripts/harvest_catalogue.py

      # Rebuild only when the harvest changed records; otherwise a no-op
      # run (e.g. a failed retry of the same error) would still commit a
      # stats.json built_at bump and redeploy Pages for nothing.
      # QA runs --strict: a threshold breach (parser regression, corrupt
      # JSONL, mass record loss) must NOT reach the published site.
      - name: Build catalogue and QA gate
        id: qa
        continue-on-error: true
        run: |
          if git diff --quiet data/catalogue/; then
            echo "No records changed; skipping rebuild."
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/build_catalogue.py
          if python3 scripts/qa_catalogue.py --strict; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # The harvest itself is still worth keeping (raw records + the QA
      # report explaining the breach); only the publish is withheld.
      - name: Withhold publish on QA breach
        if: steps.qa.outputs.status == 'fail'
        run: |
          echo "QA gate breached - reverting docs/ so nothing bad publishes."
          git checkout -- docs/data || true

      - name: Commit progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue/ docs/data/
          if git diff --cached --quiet; then
            echo "No new pages harvested."
          else
            git commit -m "data: catalogue harvest chunk $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Open an issue on QA breach
        if: steps.qa.outputs.status == 'fail'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "QA gate breached - publish withheld ($(date -u +%Y-%m-%d))" \
            --body "$(printf 'The harvest QA gate failed, so `docs/` was NOT published; the raw harvest and the QA report were still committed.\n\nSee `data/catalogue/QA.md` (Gate section) and run %s/actions/runs/%s.\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"

      - name: Fail the job when the QA gate breached
        if: steps.qa.outputs.status == 'fail'
        run: exit 1
