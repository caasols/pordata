name: sitemap watch

# Fetches the PORDATA sitemap (one polite request), diffs it against the
# last committed snapshot, commits the new snapshot plus a changelog entry,
# and opens a GitHub issue when indicator pages were added or removed.
# The detector drives the worker: when the fresh snapshot leaves the
# harvester with pending work (new, stale or errored pages), this workflow
# dispatches harvest.yml so changes are picked up minutes after detection.
#
# The cron schedule only fires once this file is on the default branch;
# until then the paths-filtered push trigger and (post-merge) manual
# dispatch cover it.

on:
  workflow_dispatch:
  schedule:
    # Measured from a year of sitemap lastmods: PORDATA publishes on
    # weekdays only (zero Saturdays, ~weekly-noise Sundays), in batches
    # spread across Mon-Fri. Morning run catches yesterday's changes;
    # the weekday late-afternoon run (17:30 Lisbon in summer) catches
    # same-day publishes within hours.
    - cron: "17 6 * * *"
    - cron: "30 16 * * 1-5"
  push:
    paths:
      - ".github/workflows/sitemap.yml"
      - "scripts/fetch_sitemap.py"
      - "scripts/diff_sitemap.py"

permissions:
  contents: write
  issues: write
  actions: write  # to dispatch harvest.yml when work is pending

# Runs push commits; queue them instead of letting concurrent runs race.
concurrency:
  group: sitemap-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # branch head at RUN time, not the trigger-time sha —
          # a queued run must not work from a stale snapshot
          ref: ${{ github.ref_name }}

      - name: Fetch sitemap
        run: python3 scripts/fetch_sitemap.py

      - name: Diff against last snapshot
        id: diff
        run: python3 scripts/diff_sitemap.py --changelog | tee /tmp/sitemap-diff.md

      - name: Commit snapshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing staged; skipping commit."
          else
            git commit -m "data: sitemap snapshot $(date -u +%Y-%m-%d) (+${{ steps.diff.outputs.added }} -${{ steps.diff.outputs.removed }} ~${{ steps.diff.outputs.updated }})"
            git push
          fi

      - name: Open issue for added/removed pages
        if: steps.diff.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "PORDATA sitemap: +${{ steps.diff.outputs.added }} -${{ steps.diff.outputs.removed }} pages ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/sitemap-diff.md

      # Detector -> worker: harvest exactly what the fresh snapshot says is
      # pending. Runs even when the sitemap is unchanged so stored error
      # records keep being retried. Main only - the paths-filtered push
      # trigger also runs this workflow on feature branches, and a harvest
      # dispatched there would commit data to the feature branch.
      - name: Dispatch harvest if work is pending
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); \
            import pordata_lib as lib, harvest_catalogue as h; \
            p = h.plan(lib.targets(), lib.load_records()); \
            print(sum(len(v) for v in p.values()))")
          echo "pending pages: $pending"
          if [ "$pending" -gt 0 ]; then
            gh workflow run harvest.yml --ref "${{ github.ref_name }}"
          fi
