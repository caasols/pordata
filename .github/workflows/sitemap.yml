name: sitemap watch

# Fetches the PORDATA sitemap (one polite request), diffs it against the
# last committed snapshot, commits the new snapshot plus a changelog entry,
# and opens a GitHub issue when indicator pages were added or removed.
# The detector drives the worker: when the fresh snapshot leaves the
# harvester with pending work (new, stale or errored pages), this workflow
# dispatches harvest.yml so changes are picked up minutes after detection.
#
# The cron schedule only fires once this file is on the default branch;
# until then the paths-filtered push trigger and (post-merge) manual
# dispatch cover it.

on:
  workflow_dispatch:
  schedule:
    # Measured from a year of sitemap lastmods: PORDATA publishes on
    # weekdays only (zero Saturdays, ~weekly-noise Sundays), in batches
    # spread across Mon-Fri. Times bracket the Lisbon working day (owner
    # call): mid-morning catches yesterday plus early publishes, the
    # weekday evening run (19:23 Lisbon in summer) catches same-day
    # publishes after hours. Off-the-hour minutes because GitHub delays
    # or skips top-of-the-hour schedules under load.
    - cron: "7 9 * * *"
    - cron: "23 18 * * 1-5"
  push:
    paths:
      - ".github/workflows/sitemap.yml"
      - "scripts/fetch_sitemap.py"
      - "scripts/diff_sitemap.py"

permissions:
  contents: write
  issues: write
  actions: write  # to dispatch harvest.yml when work is pending

# Runs push commits; queue them instead of letting concurrent runs race.
concurrency:
  group: sitemap-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # One sitemap fetch, a diff and a dispatch. Without a bound this
    # inherits GitHub's 6-hour default, so a stalled fetch holds the
    # concurrency group all day and the detector silently stops
    # detecting - the queued runs behind it never start.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # branch head at RUN time, not the trigger-time sha —
          # a queued run must not work from a stale snapshot
          ref: ${{ github.ref_name }}

      - name: Fetch sitemap
        run: python3 scripts/fetch_sitemap.py

      - name: Diff against last snapshot
        id: diff
        run: python3 scripts/diff_sitemap.py --changelog | tee /tmp/sitemap-diff.md

      # Before the commit, deliberately. The diff is computed against the
      # *committed* snapshot, so advancing it first meant a failed
      # `gh issue create` lost the add/remove notification for good — the
      # next run compared against the new snapshot and saw nothing to
      # report. Notifying first makes the failure self-healing: the
      # snapshot stays put, and the next run re-detects and re-notifies.
      # (The change record itself was never at risk: data/CHANGELOG.md is
      # committed with the snapshot.)
      - name: Open issue for added/removed pages
        if: steps.diff.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "PORDATA sitemap: +${{ steps.diff.outputs.added }} -${{ steps.diff.outputs.removed }} pages ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/sitemap-diff.md

      - name: Commit snapshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The three files this workflow actually writes, not all of
          # data/. Six workflows stage overlapping paths under six
          # distinct concurrency groups, so a broad `git add` here made
          # this job a writer of the harvest's and the crosswalks'
          # output too — a lock nobody wants, or a race nobody sees.
          git add data/sitemap-urls.txt data/sitemap-lastmod.tsv \
                  data/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing staged; skipping commit."
          else
            git commit -m "data: sitemap snapshot $(date -u +%Y-%m-%d) (+${{ steps.diff.outputs.added }} -${{ steps.diff.outputs.removed }} ~${{ steps.diff.outputs.updated }})"
            # The last bare push in the repo. harvest.yml has rebased
            # since it was written and spikes.yml was fixed in 3fabbc9;
            # this one was missed both times, and it is the workflow most
            # likely to collide, since it can dispatch the harvester and
            # then race the commit it triggers.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      # Detector -> worker: harvest exactly what the fresh snapshot says is
      # pending. Runs even when the sitemap is unchanged so stored error
      # records keep being retried. Main only - the paths-filtered push
      # trigger also runs this workflow on feature branches, and a harvest
      # dispatched there would commit data to the feature branch.
      # always(): pending pages are worth fetching even if the notify or
      # commit step above failed. The harvest job checks out the branch
      # head, so it plans from the committed snapshot either way.
      - name: Dispatch harvest if work is pending
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); \
            import pordata_lib as lib, harvest_catalogue as h; \
            p = h.plan(lib.targets(), lib.load_records()); \
            print(sum(len(v) for v in p.values()))")
          echo "pending pages: $pending"
          if [ "$pending" -gt 0 ]; then
            gh workflow run harvest.yml --ref "${{ github.ref_name }}"
          fi
