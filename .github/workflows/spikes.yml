name: spikes

# One-off research probes that need open internet (the remote Claude
# sandbox cannot reach pordata.pt or ine.pt). Commits the markdown
# analyses under data/spikes/; raw responses go to a workflow artifact
# only, so no PORDATA/INE page content lands in the repo.
#
# Dispatch-only, and one probe per run. These are one-off questions: a
# push trigger used to re-run them on any edit to the scripts - even a
# comment - burning polite requests on questions already answered
# (2026-08-23 audit). Running every probe on every dispatch is the same
# waste in a different shape, so the probe is chosen explicitly.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Which probe to run (each costs polite requests)"
        required: true
        default: a3
        type: choice
        options:
          - a1
          - a2
          - a3
          - a4
          - a6
          - licences
          - eurostat-toc
          - ine-series
          - europa-period

permissions:
  contents: write

concurrency:
  group: spikes
  cancel-in-progress: false

jobs:
  spikes:
    runs-on: ubuntu-latest
    # The longest probe is A6: 15 pages 20s apart, some of them 2 MB.
    # 45 minutes is generous for that and still bounded, where the
    # 6-hour default is not.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # branch head, not the trigger-time sha: this job pushes,
          # and a detached checkout of a stale sha cannot fast-forward
          ref: ${{ github.ref_name }}

      - name: "Spike A1: PORDATA indicator page probe"
        if: inputs.probe == 'a1'
        run: python3 scripts/spike_pordata_probe.py

      - name: "Spike A2: INE catalogue enumerability"
        if: inputs.probe == 'a2'
        run: python3 scripts/spike_ine_catalogue.py

      - name: "Spike A3: period, geography and unit in the page HTML"
        if: inputs.probe == 'a3'
        run: python3 scripts/spike_coverage_fields.py

      - name: "Spike A4: where the period lives on municipios pages"
        if: inputs.probe == 'a4'
        run: python3 scripts/spike_municipios_period.py

      - name: "Spike A6: full page inventory - what are we not capturing?"
        if: inputs.probe == 'a6'
        run: python3 scripts/spike_page_inventory.py

      # Not a probe about PORDATA: the reuse terms of the three sources
      # item 14 would archive from. Runs here because this sandbox has no
      # route to any of them, and decision 7 forbids asserting an
      # upstream from memory.
      - name: "Licences: fetch INE, Eurostat and BPstat reuse terms"
        if: inputs.probe == 'licences'
        run: python3 scripts/spike_licences.py

      # Roadmap 2's open half: measure Eurostat before specifying a
      # crosswalk for it. A5's one-to-many shape is a fact about INE.
      - name: "Eurostat: catalogue shape, size and identifiers"
        if: inputs.probe == 'eurostat-toc'
        run: python3 scripts/spike_eurostat_toc.py

      # Roadmap 14's three open questions. Measurement only — the bodies
      # go to the artifact, never the repo, which is what lets this run
      # before item 13 records INE's reuse terms.
      - name: "INE: the shape of a series response"
        if: inputs.probe == 'ine-series'
        run: python3 scripts/spike_ine_series.py

      # Roadmap 20's last question: europa has neither the portugal year
      # elements nor the municipios picker.
      - name: "Europa: where the period lives"
        if: inputs.probe == 'europa-period'
        run: python3 scripts/spike_europa_period.py

      - name: Upload raw responses as artifact
        uses: actions/upload-artifact@v4
        with:
          name: spike-raw
          path: data/spikes/raw/
          retention-days: 14

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spikes/*.md
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "data: spike report (${{ inputs.probe }})"
            git push
          fi
