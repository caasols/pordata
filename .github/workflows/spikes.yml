name: spikes

# One-off research probes that need open internet (the remote Claude
# sandbox cannot reach pordata.pt or ine.pt). Commits the markdown
# analyses under data/spikes/; raw responses go to a workflow artifact
# only, so no PORDATA/INE page content lands in the repo.
#
# Dispatch-only: these probes are finished research, and their
# conclusions are recorded in context.md. A push trigger re-ran them on
# any edit to the scripts - even a comment - burning polite requests on
# questions already answered (2026-08-23 audit).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spikes
  cancel-in-progress: false

jobs:
  spikes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Spike A1: PORDATA indicator page probe"
        run: python3 scripts/spike_pordata_probe.py

      - name: "Spike A2: INE catalogue enumerability"
        run: python3 scripts/spike_ine_catalogue.py

      - name: Upload raw responses as artifact
        uses: actions/upload-artifact@v4
        with:
          name: spike-raw
          path: data/spikes/raw/
          retention-days: 14

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spikes/*.md
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "data: spike reports (A1 pordata probe, A2 ine catalogue)"
            git push
          fi
