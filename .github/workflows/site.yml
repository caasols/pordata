name: site build

# Quality gates for the React app in site/, mirroring the Python side:
# typecheck + vite build, vitest with an 80% line-coverage gate, and
# StrykerJS mutation testing over src/lib.
#
# The deployed bundle in docs/ is committed by whoever edits the UI
# (npm run build writes ../docs). This workflow proves the source and
# commits nothing — but it does check that the committed bundle actually
# matches that source, because otherwise the live site can lag its own
# repo indefinitely and nothing says so. The build is byte-deterministic
# (verified: two consecutive builds of the same tree leave docs/
# unchanged), so a diff means a stale commit, not build noise.

# The bundle paths are in the trigger for a reason the gate itself
# taught: it went red on a push that changed site/src without rebuilding,
# and then nothing could turn it green again, because the fix touches
# only docs/ and docs/ was not a trigger. A gate you cannot clear by
# fixing what it flagged stays red until an unrelated push happens by.
# Scoped to the two build outputs it actually compares, so the nightly
# harvest — which rewrites docs/data and docs/indicador — does not drag
# a site build along with it.
on:
  push:
    paths:
      - "site/**"
      - "docs/index.html"
      - "docs/assets/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Committed docs/ bundle matches this source
        # `npm run build` above rewrote ../docs; if that changes anything
        # tracked, whoever edited site/ did not rebuild before committing
        working-directory: .
        run: |
          if git diff --quiet -- docs/; then
            echo "docs/ bundle is current"
          else
            echo "::error::docs/ is stale — run 'npm run build' in site/ and commit the result"
            git diff --stat -- docs/
            exit 1
          fi
      - name: Unit tests + coverage gate (80% lines)
        run: npm run test:coverage

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Mutation testing (StrykerJS over src/lib)
        run: npm run mutation
