name: site build

# Build check for the React app in site/ — verifies typecheck + vite
# build on every push touching it. The deployed bundle in docs/ is
# committed by whoever edits the UI (npm run build writes ../docs);
# this workflow only proves the source still builds, it commits nothing.

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
