name: eurostat catalogue snapshot

# Cache Eurostat's dataset catalogue in the repo, the way
# ine-catalogue.yml caches INE's, so the crosswalk runs offline on every
# harvest instead of re-fetching 2 MB of TSV.
#
# Manual, because a catalogue of ~8,500 datasets does not change hourly
# and there is no reason to poll it. Eurostat has no bot protection to
# work around (all four endpoints served on the first try, unlike INE) —
# this is dispatch-only for politeness rather than necessity.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eurostat-catalogue
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # branch head at run time, not the trigger-time sha, since
          # this job pushes
          ref: ${{ github.ref_name }}

      - name: Fetch and parse the Eurostat catalogue
        run: python3 scripts/fetch_eurostat_catalogue.py

      # The rule `ine-catalogue.yml` states in as many words and this one
      # did not follow: a refreshed catalogue that did not rebuild the
      # crosswalk leaves the routing pointing at the previous snapshot's
      # codes with nothing saying so. The 118 published Eurostat panels
      # render cached titles as live links, so the stale window was
      # unbounded — `build_eurostat_crosswalk.py` runs nowhere else
      # except behind harvest.yml's `pass`, which the ordinary nightly
      # never reaches. Its own floor refuses to overwrite on a collapse.
      - name: Rebuild the Eurostat crosswalk and the pages showing it
        id: qa
        run: |
          python3 scripts/build_eurostat_crosswalk.py
          python3 scripts/build_detail_pages.py --strict
          # This job writes under docs/, so it passes the same gate every
          # other publish path does — including the crosswalk floors it
          # just rebuilt.
          python3 scripts/qa_catalogue.py --strict
          echo "status=pass" >> "$GITHUB_OUTPUT"

      - name: Commit cache
        if: steps.qa.outputs.status == 'pass'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eurostat/ data/crosswalk/ docs/
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "data: Eurostat catalogue snapshot $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
