name: preset fetch

# One-off: resolve a ui.shadcn.com theme preset by loading the creator in
# headless Chrome on a runner (the preset resolves client-side; no API
# serves it) and printing the computed design tokens for light and dark.
# Temporary utility; remove after use.

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Preset id"
        required: true
        default: "b1FQyVz3C"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract tokens via headless Chrome
        env:
          PRESET: ${{ inputs.preset }}
        run: |
          npm init -y > /dev/null 2>&1
          npm install --no-fund --no-audit playwright-core > /dev/null 2>&1
          cat > extract.js <<'EOF'
          const { chromium } = require("playwright-core");
          const KEYS = ["background","foreground","card","card-foreground",
            "popover","popover-foreground","primary","primary-foreground",
            "secondary","secondary-foreground","muted","muted-foreground",
            "accent","accent-foreground","destructive",
            "destructive-foreground","border","input","ring","radius",
            "chart-1","chart-2","chart-3","chart-4","chart-5",
            "font-sans","font-serif","font-mono"];
          (async () => {
            const browser = await chromium.launch({ channel: "chrome" });
            const page = await browser.newPage({
              viewport: { width: 1400, height: 900 } });
            const url = "https://ui.shadcn.com/create?item=preview&preset="
              + process.env.PRESET + "&base=radix";
            await page.goto(url, { waitUntil: "load", timeout: 90000 });
            await page.waitForTimeout(12000); // let the app resolve the preset
            for (const frame of page.frames()) {
              try {
                const result = await frame.evaluate((keys) => {
                  const read = () => {
                    const out = {};
                    const cs = getComputedStyle(document.documentElement);
                    for (const k of keys) {
                      const v = cs.getPropertyValue("--" + k).trim();
                      if (v) out["--" + k] = v;
                    }
                    return out;
                  };
                  const wasDark =
                    document.documentElement.classList.contains("dark");
                  document.documentElement.classList.remove("dark");
                  const light = read();
                  document.documentElement.classList.add("dark");
                  const dark = read();
                  document.documentElement.classList.toggle("dark", wasDark);
                  return { light, dark,
                    font: getComputedStyle(document.body).fontFamily,
                    htmlClass: document.documentElement.className.slice(0, 300),
                  };
                }, KEYS);
                if (Object.keys(result.light).length) {
                  console.log("===FRAME=== " + frame.url().slice(0, 140));
                  console.log(JSON.stringify(result, null, 1));
                }
              } catch (e) { /* cross-origin or dead frame */ }
            }
            await browser.close();
          })();
          EOF
          node extract.js
