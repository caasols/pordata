name: featured sets

# 3c: capture PORDATA's editorial featured-indicator selections from two
# quadro+resumo pages and two Retratos (4 requests, 20s apart), then
# rebuild the published catalogue with the flags. Manual dispatch.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: featured-sets
  cancel-in-progress: false

jobs:
  featured:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch featured sets
        run: python3 scripts/fetch_featured_sets.py

      - name: Rebuild catalogue with flags
        run: |
          python3 scripts/build_catalogue.py
          python3 scripts/qa_catalogue.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue/ docs/data/
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "data: featured-indicator sets + catalogue rebuild"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
