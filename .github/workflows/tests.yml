name: tests

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "setup.cfg"
      - "conftest.py"
      # every workflow, not just this one: tests/test_workflows.py asserts
      # invariants across all eight, so an edit to any of them is exactly
      # when those assertions need to run. Data commits touch data/ and
      # docs/ only, so this does not fire on every harvest.
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests with coverage
        # spike_*, fetch_ine_catalogue and fetch_sitemap are network
        # fetchers exercised by live Actions runs rather than unit tests.
        # pyyaml is for tests/test_workflows.py only - the scripts this
        # repo actually runs stay on the standard library, so a harvest
        # never depends on an install step succeeding.
        run: |
          pip install --quiet coverage pyyaml
          coverage run --source=scripts -m unittest discover -s tests -v
          coverage report -m \
            --omit="scripts/spike_*,scripts/fetch_ine_catalogue.py,scripts/fetch_sitemap.py,scripts/__init__.py" \
            --fail-under=80

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Mutation testing (mutmut)
        # A gate since 2026-08-24, matching StrykerJS on the site side.
        # `mutmut run` exits non-zero whenever anything survived, which is
        # normal, so its status is ignored and the floor is enforced by
        # mutation_gate.py reading the tallies from the run log.
        run: |
          pip install --quiet mutmut pytest
          python3 -m mutmut run > mutmut-run.log 2>&1 || true
          {
            echo "## Mutation testing (mutmut)"
            echo '```'
            python3 scripts/mutation_gate.py mutmut-run.log || true
            echo '```'
            echo "<details><summary>survivors</summary>"
            echo '```'
            python3 -m mutmut results 2>/dev/null | head -60
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/mutation_gate.py mutmut-run.log
